spring.application.name=RealEstateTransactionSystem
spring.datasource.url=${DB_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}

# Keycloak and oauth2 configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/RealEstateSystem
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs
server.port=${SERVER_PORT}
resource-id=${RESOURCE_ID}
jwt.auth.converter.principle-attribute=${PRINCIPLE_ATTRIBUTE}

# Keycloak URLs
add-user-url = ${ADD_USER_URL}
get-user-keycloak-url = ${GET_USER_KEYCLOAK_ID_URL}
get-user-token-url = ${GET_USER_TOKEN_URL}
get-role-id-url = ${GET_KEYCLOAK_ROLE_ID_URL}
get-client-id-url = ${GET_CLIENT_ID_URL}
assign-role-keycloak-url = ${ASSIGN_KEYCLOAK_ROLE_URL}
client-secret = ${CLIENT_SECRET}
admin-client-id = ${ADMIN_CLIENT_ID}
keycloak-base-url = ${KEYCLOAK_BASE_URL}
# show sql commands
spring.jpa.show-sql=false
# show sql queries
spring.jpa.properties.hibernate.format_sql=false
# ddl (create, alter, truncate)
spring.jpa.generate-ddl=true
spring.jpa.open-in-view=true

spring.jpa.hibernate.ddl-auto=none
# Error tracing
server.error.include-message=always
server.error.include-stacktrace=always

logging.file.name=realestate.log

# Email

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# Rabbitmq
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

rabbitmq-queue-name = ${RABBITMQ_QUEUE_NAME}
rabbitmq-exchange-name = ${RABBITMQ_EXCHANGE_NAME}
rabbitmq-routing-key-name = ${RABBITMQ_ROUTING_KEY_NAME}
rabbitmq-json-queue-name = ${RABBITMQ_JSON_QUEUE_NAME}
rabbitmq-json-routing-key-name = ${RABBITMQ_JSON_ROUTING_KEY_NAME}
